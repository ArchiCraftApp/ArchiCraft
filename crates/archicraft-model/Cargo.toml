[package]
name = "archicraft-model"
description = "ArchiCraft domain model: project, storeys, resources, elements and the command/undo core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
indexmap.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[features]
# A test-only element kind (src/kinds/mod.rs). Enabled for this crate's tests
# by the dev-dependency on itself below and for the other crates' tests by
# theirs; never in a normal or release build.
test-kinds = []

[dev-dependencies]
archicraft-model = { workspace = true, features = ["test-kinds"] }
serde_json.workspace = true

[lints]
workspace = true
