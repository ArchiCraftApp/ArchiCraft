[package]
name = "archicraft-app"
description = "ArchiCraft desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "archicraft"
path = "src/main.rs"

[features]
# Frame-time and latency instrumentation (NFR-PERF-001, docs/performance/README.md).
# Off by default: without it no measurement code is compiled.
perf = []

[dependencies]
archicraft-geometry.workspace = true
archicraft-ifcx.workspace = true
archicraft-model.workspace = true
bytemuck.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui_tiles.workspace = true
fluent-bundle.workspace = true
fluent-syntax.workspace = true
rfd.workspace = true
rstar.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unic-langid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true

[dev-dependencies]
# The test-only element kind (archicraft_model::kinds), for kinds without
# kind-specific panels.
archicraft-model = { workspace = true, features = ["test-kinds"] }
egui_kittest = { workspace = true, features = ["eframe"] }
proc-macro2.workspace = true
syn.workspace = true

[lints]
workspace = true
