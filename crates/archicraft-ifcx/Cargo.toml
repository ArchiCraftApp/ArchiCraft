[package]
name = "archicraft-ifcx"
description = "ArchiCraft IFCX (IFC5) reader and writer, versioned adapter for ifcx_alpha"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `cargo bench` passes criterion's options (--warm-up-time and so on) to every
# bench target; the libtest harness of the library would reject them.
[lib]
bench = false

[features]
# A mock successor of ifcx_alpha (src/successor/) that proves the adapter
# table takes a second IFCX version without touching the model or geometry
# crates (IFX-091, NFR-MNT-004). Test-only; never in a release build.
successor-stub = []

[dependencies]
archicraft-geometry.workspace = true
archicraft-model.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
# The test-only element kind (archicraft_model::kinds), for kinds without
# kind-specific code here.
archicraft-model = { workspace = true, features = ["test-kinds"] }
criterion.workspace = true
insta.workspace = true
jsonschema.workspace = true

# Runs the example's unit tests (the timestamp check) with `cargo test`.
[[example]]
name = "archicraft_schema"
test = true

[[bench]]
name = "ifcx"
harness = false

[lints]
workspace = true
