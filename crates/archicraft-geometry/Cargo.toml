[package]
name = "archicraft-geometry"
description = "ArchiCraft geometry evaluation: element bodies, junctions, plan cuts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `cargo bench` passes criterion's options (--warm-up-time and so on) to every
# bench target; the libtest harness of the library would reject them.
[lib]
bench = false

[dependencies]
archicraft-model.workspace = true
geo.workspace = true
glam.workspace = true
rstar.workspace = true
spade.workspace = true
tracing.workspace = true

[features]
# The model's test-only element kind with its geometry generator
# (src/kinds/mod.rs). Enabled for this crate's tests by the dev-dependency on
# itself below and for the other crates' tests by theirs; never in a normal
# or release build.
test-kinds = ["archicraft-model/test-kinds"]

[dev-dependencies]
archicraft-geometry = { workspace = true, features = ["test-kinds"] }
criterion.workspace = true

[[bench]]
name = "geometry"
harness = false

[lints]
workspace = true
