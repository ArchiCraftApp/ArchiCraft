[package]
name = "archicraft-geometry"
description = "ArchiCraft geometry evaluation: element bodies, junctions, plan cuts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `cargo bench` passes criterion's options (--warm-up-time and so on) to every
# bench target; the libtest harness of the library would reject them.
[lib]
bench = false

[dependencies]
archicraft-model.workspace = true
geo.workspace = true
glam.workspace = true
spade.workspace = true
tracing.workspace = true

[dev-dependencies]
# The test-only element kind (archicraft_model::kinds), for kinds without
# kind-specific code here.
archicraft-model = { workspace = true, features = ["test-kinds"] }
criterion.workspace = true

[[bench]]
name = "geometry"
harness = false

[lints]
workspace = true
