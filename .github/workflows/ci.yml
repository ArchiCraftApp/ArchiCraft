name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Build and test on Linux and Windows (SRS NFR-PORT-001, NFR-PORT-003). macOS
  # (NFR-PORT-002) runs only for releases and by hand: .github/workflows/macos.yml.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # NFR-PORT-004: check out as a Windows developer would, with end-of-line conversion on;
      # .gitattributes keeps the golden files byte-exact all the same.
      - name: Enable end-of-line conversion (core.autocrlf=true)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # IFX-006 / NFR-MNT-003: load every reference model with buildingSMART's
  # reference implementation and viewer composition at the pinned commit.
  conformance:
    name: IFCX conformance (buildingSMART reference code)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - name: Write the reference models
        run: cargo run --locked -p archicraft-ifcx --example reference_models -- target/reference-models
      - name: Load them with the reference implementation and viewer composition
        run: conformance/run.sh target/reference-models/*.ifcx crates/archicraft-ifcx/tests/golden/*.ifcx

  # docs/loop.md: the bead-loop rules every pull request keeps, the headless-crate layering
  # and the self-test of the loop's hooks. A required check for auto-merge.
  loop-policy:
    name: Loop policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # ci-check.sh reads the PR labels live: gh pr create attaches them after the PR is opened.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Self-test of the loop hooks and scripts
        run: scripts/loop/selftest.sh
      - name: Headless crates have no UI dependencies
        run: scripts/loop/check-layering.sh
      - name: Pull request rules
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/loop/ci-check.sh

  # NFR-LEG-001: licence inventory and policy; RustSec advisories; NFR-SEC-001/NFR-SEC-004:
  # no HTTP client crates (deny.toml).
  licences:
    name: Licences and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  # Mechanical guards for done requirements (docs/testing.md, done-requirement traceability).
  guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Layering of the headless crates (NFR-MNT-002, NFR-MNT-004)
        run: scripts/check-layering.sh
      - name: No unreviewed trademarks or third-party assets (NFR-LEG-002)
        run: scripts/check-legal.sh
      - name: Negative self-test of the guards
        run: scripts/guards-selftest.sh
