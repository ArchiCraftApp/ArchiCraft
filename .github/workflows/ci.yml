name: CI

# A bead PR runs this workflow once for its pull_request event, then once more in the merge queue
# (merge_group) on main with the PRs ahead of it, before it merges; a push runs it only on main and
# for version tags, not a second time for the PR's branch (docs/loop.md, Enforcement and "The merge
# queue"). Every required check (setup-github.sh) is a job here that runs on merge_group too, or the
# queue waits for it until its timeout and drops the PR.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Build and test on Linux (SRS NFR-PORT-003). Windows (NFR-PORT-001) runs on main, nightly
  # and by hand: .github/workflows/windows.yml. macOS (NFR-PORT-002) runs only for releases and
  # by hand: .github/workflows/macos.yml.
  test:
    name: Test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      # NFR-PERF-001: the frame-time and latency instrumentation is off by default; build
      # and test it on one OS so the feature-gated code cannot rot (docs/performance/README.md).
      - name: Build with the perf feature
        run: cargo build -p archicraft-app --all-targets --features perf --locked
      - name: Test with the perf feature
        run: cargo test -p archicraft-app --features perf --locked
      # IFX-091 / NFR-MNT-004: the mock successor adapter behind successor-stub proves that a
      # second IFCX version plugs into ADAPTERS; its tests only run with the feature
      # (docs/ifcx-evolution.md).
      - name: Test with the successor-stub feature
        run: cargo test -p archicraft-ifcx --features successor-stub --locked
      - name: clippy with the successor-stub feature
        run: cargo clippy -p archicraft-ifcx --all-targets --features successor-stub --locked -- -D warnings

  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy with the perf feature (NFR-PERF-001)
        run: cargo clippy -p archicraft-app --all-targets --features perf --locked -- -D warnings

  # IFX-006 / NFR-MNT-003: load every reference model with buildingSMART's
  # reference implementation, its viewer composition and the viewer itself in headless
  # Chromium, at the pinned commit (conformance/README.md).
  conformance:
    name: IFCX conformance (buildingSMART reference code)
    runs-on: ubuntu-24.04
    # The job's budget: 1 to 3 minutes (cold Rust cache), and up to 5 more when it installs
    # Chromium's system libraries (that step's own limit), so a hang still fails it early.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - name: Install the conformance tools
        working-directory: conformance
        run: npm ci --no-audit --no-fund
      # Playwright's Chromium, keyed by the pinned Playwright version in the lock file.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('conformance/package-lock.json') }}
      # System libraries only when Chromium does not start: the runner image has them all, and
      # `npx playwright install-deps` fetched 26 MB of fonts and upgrades from the Ubuntu mirror on
      # every run, so a slow mirror cancelled the job (archicraft-1er5). A missing one brings in
      # Playwright's list with apt retries, in two attempts of 90 s at most; this step's limit
      # stops anything else that hangs.
      - name: Install Chromium and the system libraries the runner image lacks
        timeout-minutes: 5
        run: conformance/install-chromium.sh
      - name: Write the reference models
        run: cargo run --locked -p archicraft-ifcx --example reference_models -- target/reference-models
      - name: Load them with the reference implementation, viewer composition and viewer
        run: conformance/run.sh target/reference-models/*.ifcx crates/archicraft-ifcx/tests/golden/*.ifcx
      - name: Upload the viewer screenshots for the release check
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: viewer-screenshots
          path: conformance/test-results/*.png
          # The release check needs them: a run that wrote none fails.
          if-no-files-found: error

  # NFR-PERF-001: the benches on the merge base and on this commit, in one job on one runner,
  # in smoke mode. A bench more than 20 % slower fails the job unless the pull request has the
  # label perf-regression-accepted. The comparison table goes to the job summary and the
  # criterion reports are uploaded: the numbers published per run (docs/performance/README.md).
  bench:
    name: Bench regression gate
    # Not a required check: the PR's run compared its benches with the merge base already, and a
    # second comparison per merge group would cost ten minutes of a runner for every merge.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    # Two release builds that share their dependencies and two smoke runs: about 10 minutes
    # with a warm Rust cache.
    timeout-minutes: 30
    permissions:
      contents: read
      # The accept label is read live: a reviewer adds it and re-runs the job, whose event
      # payload still has the labels of the push.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests of the bench gate
        run: python3 scripts/tests/test_bench_gate.py
      - name: Benches on the merge base and on this commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Pushes to main compare with the previous main; a new tag or a manual run with the parent.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=HEAD^
          fi
          base="$(git merge-base "$BASE_SHA" HEAD)"
          accepted=()
          if [ -n "$PR_NUMBER" ]; then
            labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')"
            if grep -qx perf-regression-accepted <<<"$labels"; then
              accepted=(--accepted)
            fi
          fi
          scripts/bench-ci.sh "$base" "${accepted[@]}"
      - name: Upload the criterion reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: criterion-reports
          path: target/criterion
          if-no-files-found: warn

  # docs/loop.md: the bead-loop rules every pull request keeps, the headless-crate layering
  # and the self-test of the loop's hooks. A required check for auto-merge.
  loop-policy:
    name: Loop policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # ci-check.sh reads the PR labels live: gh pr create attaches them after the PR is opened.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Self-test of the loop hooks and scripts
        run: scripts/loop/selftest.sh
      - name: Headless crates have no UI dependencies
        run: scripts/loop/check-layering.sh
      - name: Pull request rules
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/loop/ci-check.sh

  # NFR-LEG-001: licence inventory and policy; RustSec advisories; NFR-SEC-001/NFR-SEC-004:
  # no HTTP client crates (deny.toml).
  licences:
    name: Licences and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  # Mechanical guards for done requirements (docs/testing.md, done-requirement traceability).
  guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Layering of the headless crates (NFR-MNT-002, NFR-MNT-004)
        run: scripts/check-layering.sh
      - name: No unreviewed trademarks or third-party assets (NFR-LEG-002)
        run: scripts/check-legal.sh
      - name: Negative self-test of the guards
        run: scripts/guards-selftest.sh

  # docs/testing.md, "Implementation status": the tables of docs/implementation-status.md are
  # generated from docs/status/requirements.json, every done row names a test or CI guard, and a
  # pull request changes the rows of the SRS IDs it lists and regresses no done row.
  status:
    name: Implementation status
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests of the status script
        run: python3 scripts/tests/test_status.py
      - name: Tables in sync with requirements.json and every done row traced
        run: python3 scripts/status.py check
      - name: Rows of the listed SRS IDs changed and no done row regressed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The checkout is the PR's merge commit: its first parent is the base it merges into,
          # so the rows are compared with exactly what the pull request changes.
          base="$BASE_SHA"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            base="$(git rev-parse HEAD^1)"
          fi
          python3 scripts/status.py merge-check --base "$base"
