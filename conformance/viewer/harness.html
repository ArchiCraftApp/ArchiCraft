<!DOCTYPE html>
<!-- Page for the headless run of buildingSMART's reference viewer (SRS IFX-006 b).
     The elements render.ts writes into (.layers div, .tree, .viewport, .attributes .table)
     and their layout follow web/viewer/index.html at the pinned commit (MIT licence); the
     web fonts and the CDN import map are left out, so the page makes no request outside
     its own origin. harness.mjs is viewer/harness.ts bundled with the viewer and three.js. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IFC5 view (ArchiCraft conformance harness)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Helvetica", "Arial", sans-serif; }
        html, body { height: 100%; }
        body > div > div { background: #eee; overflow-y: scroll; }
        .container {
            display: grid;
            grid-template-rows: 2em 1fr 1fr 1fr 2em;
            grid-template-columns: 1fr 2fr;
            height: 100vh;
            width: 100vw;
        }
        .layers { grid-row: 2; grid-column: 1; }
        .tree-container { grid-row: 3; grid-column: 1; }
        .tree { padding: 0.5em; font-size: 0.8em; }
        .tree div div { padding: 0.2em 0 0 1em; border-top: solid 1px #ddd; line-height: 24px; }
        .tree div.selected { background-color: rgba(255, 255, 0, 0.3); }
        .viewport { grid-row: 2 / 4; grid-column: 2; background: linear-gradient(#80a1c2, #eee); overflow: hidden; }
        .attributes { grid-row: 4; grid-column: 1 / 3; }
        .table { font-size: 0.8em; }
        .header { grid-row: 1; grid-column: 1 / 3; background: #666; }
        .footer { grid-row: 5; grid-column: 1 / 3; background: white; }
        h2 { background: #aaa; color: white; font-size: 0.8em; font-weight: 100; padding: 0.2em 0.5em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"></div>
        <div class="layers"><h2>Layer browser</h2><div></div></div>
        <div class="tree-container"><h2>Model tree</h2><div class="tree"></div></div>
        <div class="viewport"></div>
        <div class="attributes"><h2>Selection attributes</h2><div class="table"></div></div>
        <div class="footer"></div>
    </div>
    <script type="module" src="harness.mjs"></script>
</body>
</html>
