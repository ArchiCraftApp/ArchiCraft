# cargo-deny policy (SRS NFR-LEG-001, docs/technology-choices.md):
# only permissive licences; no GPL, LGPL or AGPL; weak copyleft (MPL-2.0)
# only after review. `cargo deny list` gives the licence inventory.

[graph]
all-features = false

[licenses]
# ArchiCraft's own crates are not published and are skipped here.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # egui's default fonts (Ubuntu-Light under the Ubuntu Font Licence 1.0,
    # Hack and emoji fonts under the SIL OFL 1.1) ship in this crate.
    # Both licences permit bundling the fonts with software. Font licences,
    # not code licences; recheck before any public release (SRS O-5).
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# NFR-SEC-001 and NFR-SEC-004: the application works offline and reaches the network only to
# fetch import URIs named in a file, after the user's consent (IFX-081). No HTTP client may
# enter the dependency graph until ifcx-interop adds that consent-gated fetch and lifts this ban.
# tokio stays allowed: it arrives through rfd for the native file dialogs.
deny = [
    { crate = "reqwest", reason = "HTTP client: network access only after consent (NFR-SEC-004, IFX-081)" },
    { crate = "ureq", reason = "HTTP client: network access only after consent (NFR-SEC-004, IFX-081)" },
    { crate = "hyper", reason = "HTTP client: network access only after consent (NFR-SEC-004, IFX-081)" },
    { crate = "isahc", reason = "HTTP client: network access only after consent (NFR-SEC-004, IFX-081)" },
    { crate = "curl", reason = "HTTP client: network access only after consent (NFR-SEC-004, IFX-081)" },
    { crate = "attohttpc", reason = "HTTP client: network access only after consent (NFR-SEC-004, IFX-081)" },
    { crate = "surf", reason = "HTTP client: network access only after consent (NFR-SEC-004, IFX-081)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Checked by the CI job "Licences and sources" (cargo deny check advisories licenses sources
# bans), which fetches the RustSec advisory database.
ignore = [
    # zbus 5 split crates, declared unmaintained after their merge into zbus 6. They reach us
    # only through eframe -> egui-winit -> accesskit_winit -> accesskit_unix (Linux
    # accessibility over D-Bus); no release of that chain uses zbus 6 yet. Unmaintained, not
    # vulnerable: drop these when eframe moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, unmaintained; only via eframe's accesskit_unix, no zbus 6 release in that chain" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, unmaintained; only via eframe's accesskit_unix, no zbus 6 release in that chain" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, unmaintained; only via eframe's accesskit_unix, no zbus 6 release in that chain" },
]
