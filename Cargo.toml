[workspace]
resolver = "3"
members = [
    "crates/archicraft-model",
    "crates/archicraft-geometry",
    "crates/archicraft-ifcx",
    "crates/archicraft-app",
]
# The cargo-fuzz targets are their own workspace on a nightly toolchain (docs/testing.md).
exclude = ["fuzz"]
default-members = [
    "crates/archicraft-model",
    "crates/archicraft-geometry",
    "crates/archicraft-ifcx",
    "crates/archicraft-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "CC-BY-4.0"
repository = "https://github.com/ArchiCraftApp/ArchiCraft"
publish = false

# Versions follow docs/technology-choices.md. The egui family is pinned exactly
# (egui is pre-1.0 and breaks its API with every release); upgrade deliberately,
# all together, once egui_tiles supports the new egui version.
[workspace.dependencies]
archicraft-model = { path = "crates/archicraft-model" }
archicraft-geometry = { path = "crates/archicraft-geometry" }
archicraft-ifcx = { path = "crates/archicraft-ifcx" }

eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    # Opens links (the About window's) in the system browser.
    "links",
    "wgpu",
    "wayland",
    "x11",
    "persistence",
] }
egui = "=0.36.2"
egui_tiles = "=0.17.1"
egui_kittest = "=0.36.2"

rfd = "0.17.2"
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34.1", features = ["serde"] }
geo = { version = "0.33.1", default-features = false }
spade = "2.15"
# Spatial index of snap targets (NFR-PERF-005). Keep at the version geo pins
# (0.12), so only one copy is compiled (docs/technology-choices.md).
rstar = "0.12.2"

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order", "raw_value"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1.28", features = ["v4", "v5", "serde"] }

thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

jsonschema = { version = "0.58.6", default-features = false }

# Performance benches (NFR-PERF-001, docs/performance/README.md). Without the
# default rayon and plotters features: no plots, the JSON estimates under
# target/criterion are what the regression gate reads.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Snapshot tests of IFCX output, reviewed as JSON diffs (IFX-007,
# docs/testing.md). Without the default colours: no terminal dependencies.
insta = { version = "=1.49.0", default-features = false }

# Localization (NFR-L10N-001): Fluent message catalogues in archicraft-app.
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"

# Number locale of the operating system (STR-010, archicraft-app i18n::os_locale):
# sys-locale everywhere as the fallback, the platform APIs where they exist.
sys-locale = "0.3.2"
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_System_SystemServices"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSLocale", "NSString"] }

# Test-only: the literal-string lint parses the sources (NFR-L10N-001).
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
# Geometry and IFCX code is slow unoptimised; keep debug builds usable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
